{% extends "layout.html" %}

{% block title %}Chat{% endblock %}

{% block content %}
<style>
    #agent-wrapper#agent-wrapper {
        position: relative;
        width: 100%;
        height: 100%;
        inset: 0;
        border: none;
        transform: none;
        .window-controls {
            display: none;
        }
    }
</style>
<script>
    const stateKey = "toolbox.agent";
    // redirect to homepage if agents are disabled
    if (!JSON.parse(localStorage.getItem(stateKey) || "{}").flavor) {
        const url = new URL(window.location);
        url.pathname = "/";
        window.location = url;
    }
    window.addEventListener("beforeunload", () => {
        const agentState = JSON.parse(localStorage.getItem(stateKey) || "{}");
        agentState.standalone = false;
        localStorage.setItem(stateKey, JSON.stringify(agentState));
    });
</script>
{% endblock %}
